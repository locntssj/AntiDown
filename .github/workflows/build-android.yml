name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip build-essential ccache autoconf automake libtool pkg-config cmake \
            zlib1g-dev libffi-dev libssl-dev libncurses5-dev libncursesw5-dev

      - name: Cache Buildozer and Gradle
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-build-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            android-build-${{ runner.os }}-

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "cython<3.0" buildozer

      - name: Prepare bundled ffmpeg
        run: |
          chmod +x bin/android/arm64-v8a/ffmpeg
          chmod +x bin/android/arm64-v8a/ffprobe
          chmod +x bin/android/arm64-v8a/ffmpeg.bin
          chmod +x bin/android/arm64-v8a/ffprobe.bin
          chmod +x bin/android/arm64-v8a/native/libantidown_ffmpeg.so
          chmod +x bin/android/arm64-v8a/native/libantidown_ffprobe.so

      - name: Build APK
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          buildozer -v android debug 2>&1 | tee buildozer-build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: buildozer-build.log
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AntiDown-debug-apk
          path: bin/*.apk
          if-no-files-found: error
